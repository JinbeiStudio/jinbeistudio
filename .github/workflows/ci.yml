name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build, typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # After the build, which generates the route types tsc relies on.
      - name: Typecheck
        run: npm run typecheck

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: out
          retention-days: 1

  lighthouse:
    name: Lighthouse
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: out

      - name: Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
